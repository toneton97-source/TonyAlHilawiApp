name: بناء تطبيق توني الهلاوي

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بناء التطبيق
        run: |
          unzip -q TonyHack2_AndroidStudio.zip
          cd TonyHack2_AndroidStudio
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: حفظ ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: TonyHack2-APK
          path: TonyHack2_AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
